# For available vmImages, see https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/hosted?view=azure-devops&tabs=yaml
# Also https://learn.microsoft.com/en-us/azure/devops/pipelines/agents/hosted-deprecation-schedule?view=azure-devops&tabs=macos-images
# and https://github.com/actions/runner-images/tree/main?tab=readme-ov-file#software-and-image-support

variables:
  GOBO_CLI_THREAD: 0

stages:

#
# Build Gobo tools.
#

  - template: .azure/build.yml
    parameters:
      os: linux_ubuntu_26_04
      c_compiler: zig
      vm_image: ubuntu-26.04

