      os: windows_2025
      c_compiler: msc
      vm_image: windows-2025

  - template: .azure/build.yml
    parameters:
      os: windows_2022
      c_compiler: zig
      vm_image: windows-2022

  - template: .azure/build.yml
    parameters:
      os: windows_2022
      c_compiler: msc
      vm_image: windows-2022

  - template: .azure/build.yml
